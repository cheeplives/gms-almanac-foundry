# A tag like v0.1.0 makes a GitHub release with module.json and module.zip, which the module's manifest address
# (…/releases/latest/download/module.json) points at. The tag must match the version in module.json.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: The tag is the module's version
        run: |
          version="$(node -p "require('./module.json').version")"
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "module.json says $version but the tag is $GITHUB_REF_NAME"; exit 1; }
      - run: zip -r module.zip module.json LICENSE README.md CHANGELOG.md scripts styles
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" module.json module.zip --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md"
